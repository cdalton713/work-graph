# The tests of the page and of the skill, and the build, on each pull request and each push to main.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The same versions as the Dockerfile.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: redis-server --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest test_wg
        working-directory: skills/work-graph/scripts
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wg-image-check .
      - name: Check runtime files
        run: |
          docker run --rm wg-image-check sh -ec '
            test ! -e vercel.json
            test ! -e api
            test ! -e server/testing
            test -z "$(find server src -name "*.test.*" -print)"
          '
