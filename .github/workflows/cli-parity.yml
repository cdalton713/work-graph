name: CLI parity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sh tests/cli-parity/run.sh
      - run: sh tests/cli-parity/check-candidate.sh
