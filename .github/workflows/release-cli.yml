name: Signed CLI release
on:
  push:
    tags: ['wg-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    environment: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {runner: macos-15-intel, target: x86_64-apple-darwin}
          - {runner: macos-15, target: aarch64-apple-darwin}
    env:
      WG_RELEASE_REPOSITORY: ${{ github.repository }}
      TARGET: ${{ matrix.target }}
      WG_RELEASE_PUBLIC_KEY: ${{ vars.WG_NEXT_PUBLIC_KEY || vars.WG_CURRENT_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Build the tagged CLI
        shell: bash
        run: |
          export WG_RELEASE_VERSION="${GITHUB_REF_NAME#wg-v}"
          test -n "$WG_RELEASE_PUBLIC_KEY"
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 build --locked --release --target "$TARGET" --manifest-path cli/Cargo.toml --bin wg-preview
          python3 -I packaging/releases/package.py build "$GITHUB_REF_NAME" "$TARGET" dist-release \
            --binary "cli/target/$TARGET/release/wg-preview"
      - name: Check tagged resources and run the extracted executable
        run: |
          python3 -I packaging/releases/package.py test "$GITHUB_REF_NAME" "$TARGET" dist-release \
            --extract "$RUNNER_TEMP/extracted"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: release-${{ matrix.target }}
          path: dist-release/
          if-no-files-found: error

  publish:
    needs: package
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      WG_RELEASE_PUBLIC_KEY: ${{ vars.WG_NEXT_PUBLIC_KEY || vars.WG_CURRENT_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: artifacts
      - name: Build the release signer
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 build --locked --manifest-path packaging/releases/signer/Cargo.toml --target-dir "$RUNNER_TEMP/signer"
          echo "WG_RELEASE_SIGNER=$RUNNER_TEMP/signer/debug/wg-release-signer" >> "$GITHUB_ENV"
      - name: Verify parity evidence and sign the four checked manifests
        env:
          WG_CURRENT_PUBLIC_KEY: ${{ vars.WG_CURRENT_PUBLIC_KEY }}
          WG_SIGNING_KEY: ${{ secrets.WG_SIGNING_KEY }}
        run: bash packaging/releases/sign.sh "$GITHUB_REF_NAME" artifacts publish
      - name: Publish the checked tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)" = "$(git rev-parse HEAD)"
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --generate-notes "${flags[@]}" publish/*
