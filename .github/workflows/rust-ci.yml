name: Rust preview
on:
  pull_request:
    paths: ['cli/**', 'packaging/**', 'tests/cli-upgrade/**', 'orca-plugin/**', 'skills/work-graph/**', '.github/workflows/release-cli.yml', 'tests/cli-parity/**', '.github/workflows/rust-ci.yml']
  push:
    branches: [main]
    paths: ['cli/**', 'packaging/**', 'tests/cli-upgrade/**', 'orca-plugin/**', 'skills/work-graph/**', '.github/workflows/release-cli.yml', 'tests/cli-parity/**', '.github/workflows/rust-ci.yml']
permissions:
  contents: read

jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install Go for the managed installer trial
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.1'
          cache: false
      - run: cargo test --locked
        env:
          WG_NATIVE_UPGRADE_TRIAL: "1"
      - run: cargo build --release --locked
      - name: Verify and archive preview
        id: archive
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[0].version')
          bin_dir="target/$CARGO_BUILD_TARGET/release"
          test "$("$bin_dir/wg" --version)" = "wg $version $CARGO_BUILD_TARGET"
          artifact="wg-$version-$CARGO_BUILD_TARGET"
          tar -czf "$artifact.tar.gz" -C "$bin_dir" wg
          echo "name=$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.archive.outputs.name }}
          path: cli/${{ steps.archive.outputs.name }}.tar.gz
          if-no-files-found: error
