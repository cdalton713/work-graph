name: Rust preview
on:
  pull_request:
    paths: ['cli/**', '.github/workflows/rust-ci.yml']
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/rust-ci.yml']
permissions:
  contents: read

jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Verify and archive preview
        id: archive
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[0].version')
          bin_dir="target/$CARGO_BUILD_TARGET/release"
          test "$("$bin_dir/wg-preview" --version)" = "wg-preview $version $CARGO_BUILD_TARGET"
          artifact="wg-preview-$version-$CARGO_BUILD_TARGET"
          tar -czf "$artifact.tar.gz" -C "$bin_dir" wg-preview
          echo "name=$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: cli/${{ steps.archive.outputs.name }}.tar.gz
          if-no-files-found: error
