[package]
name = "wg-preview"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
http = "1"

serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
unicode-general-category = "1"
nix = { version = "0.31", features = ["user"] }
serde = "1"
graphql-parser = "0.4"
fastrand = "2"
httpdate = "1"
curl = "0.4"
